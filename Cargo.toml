[package]
name = "kolombo"
version = "0.1.0"
edition = "2024"
authors = ["Aleksandr Simonov <zlodey23@gmail.com>"]
description = "Kolombo - Kubernetes explorer"
license = "MIT"
repository = "https://github.com/0x0BSoD/kolombo"

[dependencies]
anyhow = "1.0.105"
arboard = "3.7.0"
futures = "0.3.34"
fuzzy-matcher = "0.3.7"
k8s-openapi = { version = "0.29.0", features = ["v1_37"] }
kube = { version = "5.1.0", features = ["runtime", "client"] }
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
